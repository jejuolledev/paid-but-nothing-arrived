<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paid, but nothing arrived</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--txt:#e8eaf0;--mut:#9aa3b2;--ok:#2ecc71;--bad:#ff4d4f;--grey:#4b5260;--acc:#5b8def}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,Inter,Segoe UI,sans-serif}
header{padding:28px 20px 10px;max-width:980px;margin:auto}h1{font-size:26px;margin:0 0 4px}header p{color:var(--mut);margin:0}
main{max-width:980px;margin:auto;padding:10px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
textarea{width:100%;min-height:72px;background:#0c0e12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.samples button{margin:4px 6px 0 0;font-size:13px}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}@media(max-width:640px){.chain{grid-template-columns:repeat(2,1fr)}}
.link{border-radius:10px;padding:10px;border:2px solid var(--grey);cursor:pointer;min-height:92px}.link small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.green{border-color:var(--ok);background:rgba(46,204,113,.08)}.red{border-color:var(--bad);background:rgba(255,77,79,.12);animation:pulse 1.2s ease-in-out 3}.grey{opacity:.6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,.5)}50%{box-shadow:0 0 0 8px rgba(255,77,79,0)}}
h2{font-size:18px;margin:0 0 6px}.headline{font-size:22px;font-weight:600}.mut{color:var(--mut)}
pre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.two{grid-template-columns:1fr}}
ul{margin:6px 0;padding-left:18px}.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut);margin-left:6px}
.rows table{width:100%;border-collapse:collapse;font-size:12.5px}.rows td,.rows th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.cited{background:rgba(255,77,79,.12)}
</style></head><body>
<header><h1>Paid, but nothing arrived.</h1><p>Your customer already has proof they paid. This agent finds yours — one SQL door (Zetaris) over the payment ledger, orders, grants, server logs and mail events; a local Nemotron (Meterless Nightshift) explains. <span class="tag">all data synthetic</span></p></header>
<main>
<div class="card">
  <textarea id="msg" placeholder="Paste the customer's message, e.g. “Hi, I paid for the Standard pack but nothing showed up. Order ord_0901.”"></textarea>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="go">Investigate</button><span class="mut" id="status"></span></div>
  <div class="samples" id="samples"></div>
</div>
<div id="out"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function loadCases(){const cs=await (await fetch('/api/cases')).json();$('#samples').innerHTML='<span class="mut">Seeded cases:</span> '+cs.map(c=>`<button class="ghost" data-id="${c.order_id}">${esc(c.case)}. ${esc(c.title)}</button>`).join('');
  document.querySelectorAll('#samples button').forEach(b=>b.onclick=()=>{$('#msg').value=`Hi, I paid but nothing arrived. My order is ${b.dataset.id}.`;run();});}
async function run(){const message=$('#msg').value.trim();if(!message)return;$('#status').textContent='investigating…';$('#go').disabled=true;
  const r=await (await fetch('/api/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})})).json();
  $('#go').disabled=false;$('#status').textContent=r.ok?`${r.elapsed_ms} ms · backend ${r.backend} · model ${r.llm}`:'';render(r);}
function render(r){if(!r.ok){$('#out').innerHTML=`<div class="card"><div class="headline">${esc(r.headline)}</div></div>`;return;}
  const chain=r.chain.map((l,i)=>`<div class="link ${l.state}" data-i="${i}"><b>${esc(l.label)}</b><small>${esc(l.note)}</small>${l.refs.length?`<small class="mut">${l.refs.length} row${l.refs.length>1?'s':''} ↗</small>`:''}</div>`).join('');
  const cited=new Set(r.chain.flatMap(l=>l.refs));
  const rows=Object.entries(r.rows).map(([t,rs])=>rs.length?`<h3 style="margin:10px 0 4px;font-size:14px">${t} <span class="tag">${rs.length}</span></h3><table><tr>${Object.keys(rs[0]).filter(k=>k!=='ref').map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${rs.map(x=>`<tr class="${cited.has(x.ref)?'cited':''}" id="row-${CSS.escape(x.ref)}">${Object.entries(x).filter(([k])=>k!=='ref').map(([,v])=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`:'').join('');
  $('#out').innerHTML=`<div class="card"><div class="headline">${esc(r.headline)}</div><div class="mut">order ${esc(r.order_id)} · ${esc(r.email)}</div><div class="chain">${chain}</div></div>
  <div class="card two"><div><h2>Why</h2><p>${esc(r.explanation).replace(/\[([a-z_]+:[^\]]+)\]/g,'<a href="#row-$1" style="color:var(--acc)">[$1]</a>')}</p>
   <h2>Verified</h2><ul>${r.verified.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><h2>Not verified</h2><ul>${r.unverified.map(v=>`<li>${esc(v)}</li>`).join('')||'<li class="mut">—</li>'}</ul>
   <p class="mut" style="font-size:12px">Citation check: ${r.citation_check.checked?(r.citation_check.ok?'passed':'failed → verifier text used'):'model step skipped (no endpoint)'}</p></div>
  <div><h2>Next actions</h2><h3 style="font-size:14px;margin:8px 0 4px">Reply to the customer</h3><pre>${esc(r.customer_reply)}</pre>
   <h3 style="font-size:14px;margin:8px 0 4px">Fix <span class="tag">needs your approval</span></h3><pre>${esc(r.fix_action)}</pre>
   <button class="ghost" onclick="evidence()">Dispute evidence bundle</button></div></div>
  <div class="card rows"><h2>Raw rows (cited rows highlighted)</h2>${rows}</div>
  <div class="card"><h2>Trace</h2><ul>${r.trace.map(t=>`<li><b>${esc(t.step)}</b> — ${esc(t.detail)} <span class="mut">${t.ms} ms</span></li>`).join('')}</ul></div>`;
  document.querySelectorAll('.link').forEach(el=>el.onclick=()=>{const l=r.chain[el.dataset.i];if(l.refs[0]){const row=document.getElementById('row-'+l.refs[0]);if(row)row.scrollIntoView({behavior:'smooth',block:'center'});}});}
async function evidence(){const message=$('#msg').value.trim();const t=await (await fetch('/api/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})})).text();const w=window.open('','_blank');w.document.write('<pre style="white-space:pre-wrap;font:13px/1.5 monospace;padding:20px">'+t.replace(/</g,'&lt;')+'</pre>');}
$('#go').onclick=run;loadCases();
</script></body></html>
